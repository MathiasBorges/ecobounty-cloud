  <script>
    // Redireciona 127.0.0.1 para localhost para autorização nativa do Firebase Auth (Google Sign-In)
    if (window.location && window.location.hostname === "127.0.0.1") {
      window.location.replace(window.location.href.replace("//127.0.0.1", "//localhost"));
    }
  </script>

  <script>
    // IDENTIDADE DO DISPOSITIVO (cid): cada navegador/celular recebe um ID único e persistente.
    // Ele é anexado à URL (?cid=...) para o Python isolar a sessão deste aparelho, e a todas as
    // chamadas ao servidor auxiliar (GPS, câmera, login Google, seleção de missão).
    (function () {
      try {
        var cid = localStorage.getItem("ecobounty_cid");
        if (!cid) {
          var rnd = (window.crypto && crypto.getRandomValues)
            ? Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("")
            : String(Math.random()).slice(2) + String(Date.now());
          cid = "c" + rnd;
          localStorage.setItem("ecobounty_cid", cid);
        }
        window.ECOBOUNTY_CID = cid;
        // Persiste também no formato SharedPreferences do Flutter Web (page.client_storage)
        localStorage.setItem("flutter.ecobounty_cid", JSON.stringify(JSON.stringify(cid)));
        var u = new URL(window.location.href);
        if (u.searchParams.get("cid") !== cid) {
          u.searchParams.set("cid", cid);
          window.history.replaceState(null, "", u.pathname + u.search + u.hash);
        }
      } catch (e) { window.ECOBOUNTY_CID = ""; }
    })();
  </script>

  <script>
    window.addEventListener('load', function () {
      var loading = document.querySelector('#loading');
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function (engineInitializer) {
        if (loading) loading.classList.add('main_done');
        return engineInitializer.initializeEngine({
          renderer: webRenderer,
          useColorEmoji: useColorEmoji,
        });
      }).then(function (appRunner) {
        if (loading) loading.classList.add('init_done');
        return appRunner.runApp();
      }).then(function (app) {
        window.setTimeout(function () {
          if (loading && loading.parentNode) {
            loading.remove();
          }
        }, 150);
      });
    });
  </script>

  <script>
    var currentMediaStream = null;
    var currentFacingMode = "environment";
    var currentCameraMode = "denuncia";
    var pendingPermissionType = null; // "gps" ou "camera"
    var currentUserLat = null;
    var currentUserLng = null;

    // Mostra aviso de permissão recusada com botão de reativação
    function exibirBannerPermissao(tipo, titulo, mensagem) {
      pendingPermissionType = tipo;
      var banner = document.getElementById("ecobounty-perm-banner");
      var titleEl = document.getElementById("ecoPermTitle");
      var descEl = document.getElementById("ecoPermDesc");
      var btnAction = document.getElementById("ecoPermBtnAction");
      if (titleEl) titleEl.innerText = titulo;
      if (descEl) descEl.innerText = mensagem;
      if (btnAction) btnAction.innerText = tipo === "gps" ? "Ativar Localização (GPS)" : "Ativar Câmera";
      if (banner) banner.classList.add("active");
    }

    function fecharBannerPermissao() {
      var banner = document.getElementById("ecobounty-perm-banner");
      if (banner) banner.classList.remove("active");
    }

    function reativarPermissaoPendente() {
      fecharBannerPermissao();
      if (pendingPermissionType === "gps") {
        solicitarGPS();
      } else if (pendingPermissionType === "camera") {
        abrirCameraInPage(currentCameraMode);
      }
    }

    function getEcoBountyApiBase() {
      var loc = window.location || {};
      var port = loc.port || "";
      // Execução local (porta do Flet 8550): servidor auxiliar separado na porta 8552.
      // Nuvem (Render etc.): mesma origem HTTPS, roteada pelo proxy em /ecoapi.
      if (port === "8550" || port === "8551") {
        var host = loc.hostname || "localhost";
        var proto = (loc.protocol === "https:") ? "https:" : "http:";
        return proto + "//" + host + ":8552";
      }
      return (loc.origin || "") + "/ecoapi";
    }

    // Anexa automaticamente o cid do dispositivo a toda chamada ao servidor auxiliar
    (function () {
      var origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        try {
          var url = (typeof input === "string") ? input : (input && input.url);
          var base = getEcoBountyApiBase();
          if (url && url.indexOf(base) === 0 && window.ECOBOUNTY_CID && url.indexOf("cid=") === -1) {
            url += (url.indexOf("?") === -1 ? "?" : "&") + "cid=" + encodeURIComponent(window.ECOBOUNTY_CID);
            input = (typeof input === "string") ? url : new Request(url, input);
          }
        } catch (e) {}
        return origFetch(input, init);
      };
    })();

    // 1. GPS Sob Demanda (Acionado ao abrir o mapa ou telas de rota)
    function solicitarGPS() {
      if (!("geolocation" in navigator)) {
        exibirBannerPermissao("gps", "📍 GPS Indisponível", "Seu navegador não oferece suporte à geolocalização.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          currentUserLat = lat;
          currentUserLng = lng;
          console.log("📍 [EcoBounty GPS Real]:", lat, lng, "Precisão:", pos.coords.accuracy, "m");
          fecharBannerPermissao();
          try {
            localStorage.setItem("ecobounty_real_lat", lat);
            localStorage.setItem("ecobounty_real_lng", lng);
          } catch(e) {}
          // Sincroniza via fetch diretamente com o servidor local sem recarregar a tela
          fetch(getEcoBountyApiBase() + "/location?lat=" + lat.toFixed(6) + "&lng=" + lng.toFixed(6), { mode: "cors" })
            .catch(function(err) { /* sync gps offline silencioso */ });
        },
        function(err) {
          console.warn("📍 [EcoBounty GPS Negado]:", err.message);
          exibirBannerPermissao(
            "gps",
            "📍 Localização Negada",
            "O recurso de mapa não pôde exibir sua posição exata devido à recusa de permissão de GPS. Clique abaixo para ativar."
          );
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
      );
    }

    // 2. Câmera In-Page Sob Demanda (Acionada ao clicar para tirar foto na mesma página)
    function abrirCameraInPage(mode) {
      currentCameraMode = mode || "denuncia";
      var statusEl = document.getElementById("ecoCamStatus");
      if (statusEl) statusEl.innerText = "Aponte para o resíduo e clique no botão verde para fotografar";

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        exibirBannerPermissao("camera", "📷 Câmera Indisponível", "Seu dispositivo ou navegador não suporta captura direta de câmera.");
        return;
      }

      // Solicita permissão e abre a câmera no modal in-page na mesma tela
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: currentFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(function(stream) {
        fecharBannerPermissao();
        currentMediaStream = stream;
        var videoEl = document.getElementById("ecoLiveVideo");
        if (videoEl) {
          videoEl.srcObject = stream;
          videoEl.play();
        }
        var modal = document.getElementById("ecobounty-cam-modal");
        if (modal) modal.classList.add("active");
      }).catch(function(err) {
        console.warn("📷 [EcoBounty Câmera Negada]:", err);
        exibirBannerPermissao(
          "camera",
          "📷 Câmera Negada",
          "O recurso de câmera não pode ser utilizado devido à recusa de permissão. Clique para ativar ou use o botão de arquivo/galeria."
        );
      });
    }

    function fecharCameraInPage() {
      if (currentMediaStream) {
        currentMediaStream.getTracks().forEach(function(track) { track.stop(); });
        currentMediaStream = null;
      }
      var videoEl = document.getElementById("ecoLiveVideo");
      if (videoEl) {
        videoEl.pause();
        videoEl.srcObject = null;
      }
      var modal = document.getElementById("ecobounty-cam-modal");
      if (modal) modal.classList.remove("active");
    }

    function alternarCameraInPage() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      fecharCameraInPage();
      abrirCameraInPage(currentCameraMode);
    }

    function capturarFotoInPage() {
      var videoEl = document.getElementById("ecoLiveVideo");
      var canvasEl = document.getElementById("ecoCamCanvas");
      var statusEl = document.getElementById("ecoCamStatus");
      if (!videoEl || !canvasEl) return;

      var w = videoEl.videoWidth || 640;
      var h = videoEl.videoHeight || 480;
      canvasEl.width = w;
      canvasEl.height = h;
      var ctx = canvasEl.getContext("2d");
      ctx.drawImage(videoEl, 0, 0, w, h);

      if (statusEl) statusEl.innerText = "⏳ Enviando foto com sucesso...";

      canvasEl.toBlob(function(blob) {
        if (!blob) {
          fecharCameraInPage();
          return;
        }
        var uploadLat = currentUserLat;
        var uploadLng = currentUserLng;
        if (!uploadLat) {
          try {
            uploadLat = parseFloat(localStorage.getItem("ecobounty_real_lat"));
            uploadLng = parseFloat(localStorage.getItem("ecobounty_real_lng"));
          } catch(e) {}
        }
        var uploadUrl = getEcoBountyApiBase() + "/upload?mode=" + encodeURIComponent(currentCameraMode);
        if (uploadLat && uploadLng && !isNaN(uploadLat) && !isNaN(uploadLng)) {
          uploadUrl += "&lat=" + encodeURIComponent(uploadLat) + "&lng=" + encodeURIComponent(uploadLng);
        }
        fetch(uploadUrl, {
          method: "POST",
          headers: { "Content-Type": "image/jpeg" },
          mode: "cors",
          body: blob
        }).then(function(res) { return res.json(); })
          .then(function(data) {
            console.log("📸 [Foto Enviada via In-Page Cam]:", data);
            fecharCameraInPage();
          })
          .catch(function(err) {
            console.error("Erro upload:", err);
            fecharCameraInPage();
          });
      }, "image/jpeg", 0.88);
    }

    // Funções do Modal de Mapa Leaflet In-Page
    function abrirMapaInPage(urlParams) {
      var modal = document.getElementById("ecobounty-leaflet-modal");
      var iframe = document.getElementById("ecoLeafletIframe");
      if (!modal || !iframe) return;
      var src = "/interactive_map.html";
      if (urlParams) {
        src += (urlParams.startsWith("?") ? urlParams : "?" + urlParams);
      } else {
        var lat = currentUserLat || -9.6058;
        var lng = currentUserLng || -35.7518;
        src += "?lat=" + lat + "&lng=" + lng + "&zoom=15";
      }
      iframe.src = src;
      modal.classList.add("active");
    }

    function fecharMapaInPage() {
      var modal = document.getElementById("ecobounty-leaflet-modal");
      var iframe = document.getElementById("ecoLeafletIframe");
      if (modal) modal.classList.remove("active");
      if (iframe) iframe.src = "about:blank";
    }

    function alternarLeafletFullscreen() {
      var wrap = document.getElementById("ecoMapWrap");
      var btn = document.getElementById("ecoMapExpandBtn");
      if (!wrap) return;
      wrap.classList.toggle("fullscreen");
      if (btn) {
        btn.innerText = wrap.classList.contains("fullscreen") ? "🗗 Reduzir" : "⛶ Tela Cheia";
      }
    }

    // Escuta mensagens disparadas de dentro do iframe do Leaflet
    window.addEventListener("message", function(e) {
      if (!e.data) return;
      if (e.data.type === "CLOSE_MAP") {
        fecharMapaInPage();
      } else if (e.data.type === "SELECT_BOUNTY") {
        var id = e.data.id;
        fecharMapaInPage();
        fetch(getEcoBountyApiBase() + "/select_bounty?id=" + encodeURIComponent(id), { mode: "cors" })
          .catch(function() {});
        try {
          localStorage.setItem("ecobounty_selected_bounty_id", id);
        } catch(err) {}
        if (window.location.search.indexOf("bounty_id=") === -1) {
          window.location.href = "/?bounty_id=" + id + "&tab=list";
        }
      }
    });

    // Exporta para o escopo global (window)
    window.solicitarGPS = solicitarGPS;
    window.abrirCameraInPage = abrirCameraInPage;
    window.fecharCameraInPage = fecharCameraInPage;
    window.alternarCameraInPage = alternarCameraInPage;
    window.capturarFotoInPage = capturarFotoInPage;
    window.abrirMapaInPage = abrirMapaInPage;
    window.fecharMapaInPage = fecharMapaInPage;
    window.alternarLeafletFullscreen = alternarLeafletFullscreen;

    // Loop resiliente de escuta de comandos sob demanda (com backoff e captura segura de erros)
    async function escutarComandosEcoBounty() {
      var nextDelay = 2000;
      try {
        var url = getEcoBountyApiBase() + "/action";
        var res = await window.fetch(url, {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          mode: "cors"
        });
        if (res && res.ok) {
          var data = await res.json();
          if (data && data.action) {
            console.log("⚡ [Comando EcoBounty recebido]:", data.action, data.data);
            if (data.action === "request_gps") {
              solicitarGPS();
            } else if (data.action === "open_camera") {
              abrirCameraInPage(data.data ? data.data.mode : "denuncia");
            } else if (data.action === "open_leaflet_map") {
              var q = "";
              if (data.data) {
                var d = data.data;
                var p = [];
                if (d.lat) p.push("lat=" + d.lat);
                if (d.lng) p.push("lng=" + d.lng);
                if (d.zoom) p.push("zoom=" + d.zoom);
                if (d.route_mode) p.push("route_mode=" + d.route_mode);
                if (d.dest_lat) p.push("dest_lat=" + d.dest_lat);
                if (d.dest_lng) p.push("dest_lng=" + d.dest_lng);
                if (d.bounties) p.push("bounties=" + encodeURIComponent(JSON.stringify(d.bounties)));
                q = p.join("&");
              }
              abrirMapaInPage(q);
            } else if (data.action === "trigger_google_auth") {
              if (typeof window.iniciarLoginGoogle === "function") {
                window.iniciarLoginGoogle();
              }
            }
            nextDelay = 600;
          } else {
            nextDelay = 2000;
          }
        } else {
          nextDelay = 3000;
        }
      } catch (err) {
        // Servidor local de ação ainda não iniciado ou indisponível: recua silenciosamente com backoff
        nextDelay = 4000;
      } finally {
        setTimeout(escutarComandosEcoBounty, nextDelay);
      }
    }

    window.addEventListener('load', function() {
      setTimeout(escutarComandosEcoBounty, 1000);
    });
  </script>

  <!-- Firebase App & Firebase Auth para Login Real com Google -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_GOOGLE_CLOUD_OR_FIREBASE_API_KEY",
      authDomain: "ecobounty-9d250.firebaseapp.com",
      projectId: "ecobounty-9d250",
      storageBucket: "ecobounty-9d250.firebasestorage.app",
      messagingSenderId: "497537080035",
      appId: "1:497537080035:web:a403e448d9093feb1203d6",
      measurementId: "G-KXRY4KB64S"
    };

    let fbAuth = null;
    let fbGoogleProvider = null;
    try {
      const app = initializeApp(firebaseConfig);
      fbAuth = getAuth(app);
      fbGoogleProvider = new GoogleAuthProvider();
      fbGoogleProvider.setCustomParameters({ prompt: 'select_account' });
      console.log("🔥 [EcoBounty] Firebase Auth inicializado.");
    } catch (e) {
      console.warn("⚠️ [EcoBounty] Erro ao carregar Firebase Auth:", e);
    }

    async function notificarErroGoogle(code, message) {
      try {
        await fetch(getEcoBountyApiBase() + "/google_auth_callback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          mode: "cors",
          body: JSON.stringify({
            status: "error",
            code: code,
            message: message
          })
        });
      } catch (e) {}
    }

    window.iniciarLoginGoogle = async function() {
      console.log("🔐 [EcoBounty] Disparando popup Google Sign-In...");
      if (!fbAuth || !fbGoogleProvider) {
        await notificarErroGoogle("sdk_error", "Firebase Auth não pôde ser inicializado.");
        return;
      }
      try {
        const result = await signInWithPopup(fbAuth, fbGoogleProvider);
        const user = result.user;
        console.log("✅ [EcoBounty] Google Auth sucesso:", user.email, user.displayName);
        await fetch(getEcoBountyApiBase() + "/google_auth_callback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          mode: "cors",
          body: JSON.stringify({
            status: "success",
            email: user.email,
            name: user.displayName || (user.email ? user.email.split("@")[0] : "Usuário Google"),
            photo_url: user.photoURL || "",
            uid: user.uid
          })
        });
      } catch (err) {
        console.warn("⚠️ [EcoBounty] Erro ou cancelamento no popup Google:", err);
        let msg = err.message || "Erro desconhecido";
        if (err.code === "auth/unauthorized-domain") {
          msg = "Domínio 127.0.0.1 não autorizado pelo Firebase. Acesse pelo endereço http://localhost:8550 ou adicione 127.0.0.1 nos Domínios Autorizados do Firebase Console.";
        } else if (err.code === "auth/popup-closed-by-user") {
          msg = "A janela de login do Google foi fechada antes de selecionar uma conta.";
        } else if (err.code === "auth/popup-blocked") {
          msg = "O popup de login foi bloqueado pelo seu navegador. Por favor, permita popups.";
        }
        await notificarErroGoogle(err.code || "error", msg);
      }
    };
  </script>
